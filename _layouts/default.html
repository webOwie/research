<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} | webOwie Research</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#050708">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/">web<span>Owie</span> Research</a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="/#identity">Identity</a>
        <a href="/#areas">Research Areas</a>
        <a href="/#projects">Projects</a>
        <a href="/#outputs">Outputs</a>
        <a href="https://github.com/webOwie/research">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="container" style="padding: 4rem 0 5rem; max-width: 900px;">
    <article class="card prose">
      {{ content }}
    </article>
  </main>
  <footer class="site-footer">
    <div class="container footer-row">
      <div><strong>webOwie Research</strong><br>Open Research, Intelligence Infrastructure and Applied Systems Engineering.</div>
      <div><a href="https://webowie.com">webowie.com</a> · <a href="https://github.webowie.com">GitHub</a> · <a href="https://linkedin.webowie.com">LinkedIn</a></div>
    </div>
  </footer>
</body>
</html>
